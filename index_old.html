<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREET ART WORLD</title>
    <!-- Police de style graffiti/urbain depuis Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Oswald:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* Réinitialisation de base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden; /* Empêche le scroll pendant l'attente */
        }

        /* Conteneur principal de la page de garde */
        .splash-container {
            position: relative;
            width: 100%;
            height: 100vh;
            /* Image de fond style mur/graffiti (tu peux la remplacer par ta propre image) */
            background-image: url('https://images.unsplash.com/photo-1541701494587-cb58502866ab?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Filtre sombre pour que le texte ressorte bien */
        .splash-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6); /* Assombrit l'image de 60% */
            z-index: 1;
        }

        /* Le titre principal */
        .splash-content {
            position: relative;
            z-index: 2;
            padding: 20px;
        }

        .splash-content h1 {
            font-family: 'Permanent Marker', cursive; /* Police graffiti */
            font-size: 4rem; /* Taille pour ordinateur */
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            /* Effet de superposition / ombre pour le style street art */
            text-shadow: 
                3px 3px 0 #000,
                -1px -1px 0 #000,  
                1px -1px 0 #000,
                -1px 1px 0 #000,
                1px 1px 0 #000,
                5px 5px 15px rgba(0,0,0,0.8);
            animation: fadeIn 1s ease-in-out;
        }

        /* Petit texte de chargement en dessous */
        .loading-text {
            font-family: 'Oswald', sans-serif;
            color: #ffcc00; /* Jaune fluo style graffiti */
            font-size: 1.2rem;
            margin-top: 20px;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: blink 1.5s infinite;
        }

        /* Animation d'apparition du titre */
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Animation de clignotement du texte de chargement */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* --- ADAPTATION POUR TÉLÉPHONE (Responsive) --- */
        @media (max-width: 768px) {
            .splash-content h1 {
                font-size: 2.5rem; /* Plus petit sur mobile */
                letter-spacing: 1px;
            }
            .loading-text {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="splash-container">
        <div class="splash-content">
            <h1>STREET ART<br>WORLD</h1>
            <div class="loading-text">Chargement de la galerie...</div>
        </div>
    </div>

    <script>
        // Fonction qui redirige après 3 secondes (3000 millisecondes)
        setTimeout(function() {
            // Lien public de ta collection Shopify
            window.location.href = "https://mad-tshirts.com/collections/art-and-street-art"; 
        }, 3000); 
    </script>

</body>
</html>
